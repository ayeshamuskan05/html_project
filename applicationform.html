
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicationform</title>
</head>
<body>
    <center>
    <table style="background-color:darkslategrey;color:antiquewhite" border="0" cellpadding="10" cellspacing="0">
        <tr>
            <td><b><h1>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Application Form</h1></b></td>
        </tr>
        <tr>
            <td>
                <label for="First Name">First Name: &nbsp;&nbsp;</label>
                <input type="text" name="First Name" id="First Name">
            </td>
            <td>
                <label for="Last Name">Last Name: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                <input type="text" name="Last Name" id="Last Name">
            </td>&nbsp;&nbsp&nbsp;&nbsp&nbsp;&nbsp&nbsp;&nbsp
        </tr>
        <tr>
            <td>
                <label for="Date of Birth">Date of Birth:</label>
                <input type="text" name="Last Name" id="Last Name">
            </td>
            <td>
                <label for="Age">Age: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                <input type="text" name="Age" id="Age">
            </td>
        </tr>
        <tr>
            <td>
                <label for="Gender">Gender:</label>
                <label for="Male">Male</label>
                <input type="radio" name="Gender" id="Male">
                <label for="Female">Female</label>
                <input type="radio" name="Gender" id="Female">
            </td>
            <td>
                <label for="Email-Id">Email Address:</label>
                <input type="text" name="Email-Id" id="Email-Id" placeholder="Enter Email Address">
            </td>
        </tr>
        <tr>
            <td>
                <label for="PA">Positions Available:</label>
                <input type="radio" name="PA" id="JD">
                <label for="JD">Junior Developer</label>
                <input type="radio" name="PA" id="MLD">
                <label for="MLD">Mid-level Developer</label>
                <input type="radio" name="PA" id="SA">
                <label for="SD">Senior Developer</label>
            </td>
        </tr>
        <tr>
            <td>
                <label for="PL">Programming Languages:</label>
                <input type="checkbox" name="Java" id="Java">
                <label for="Java">Java</label>
                <input type="checkbox" name="JavaScript" id="JavaScript">
                <label for="JavaScript">JavaScript</label>
                <input type="checkbox" name="Python" id="Python">
                <label for="Python">Python</label>
            </td>
        </tr>
        <tr>
            <td>
                <label for="PS">Password: &nbsp;&nbsp;&nbsp;</label>
                <input type="text" name="PS" id="PS">
            </td>
            <td>
                <label for="CPS">Confirm Password:</label>
                <input type="text" name="CPS" id="CPS">
            </td>
        </tr>
        <tr>
            <td align="center">
                    <label for="Submit">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="background-color:orangered;color:antiquewhite;padding:4px 30px">Submit</span></label>
                    <label for="Reset"><span style="background-color:orangered;color:antiquewhite;padding:4px 30px">Reset</span></label>
            </td>
        </tr>
    </table>
    </center>
    <br>
    <br>
</body>
</html>
